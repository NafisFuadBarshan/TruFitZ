{% extends "base.html" %}{% block title %}Collections | TruFitZ{% endblock %}
{% block content %}<section class="sec"><h1 class="title">Collections</h1>
<div class="catgrid">{% for c in nav_cats %}<a class="cat" href="{{ url_for('products', slug=c.slug) }}">{% if c.badge %}<span class="tag">{{ c.badge }}</span>{% endif %}<i>{{ c.icon }}</i><h3>{{ c.name }}</h3><p>{{ c.tagline }}</p><span>Explore →</span></a>{% endfor %}</div></section>{% endblock %}
